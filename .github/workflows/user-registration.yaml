name: user registration
on:
  workflow_dispatch:  
  push:
    branches:
      - develop

jobs:
  build:
    name: build
    strategy:
      matrix:
        node: [20]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os}}  # Use the matrix OS   

    steps:
    # Checkout the repository    
    - name: Checkout repository
      uses: actions/checkout@v2

    # Setup nodeJS
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node }}
    
    # Cache node modules for registration-app    
    - name: Cache node modules for registration-app
      uses: actions/cache@v3
      with:
        path: registration-app/node_modules
        key: ${{ runner.os }}-registration-app-node-modules-${{ hashFiles('registration-app/package-lock.json') }}
        restore-keys: |
           ${{ runner.os }}-registration-app-node-modules-    

   # Cache node modules for users-dashboard-app        
    - name: Cache node modules for users-dashboard-app
      uses: actions/cache@v3
      with:
        path: users-dashboard-app/node_modules
        key: ${{ runner.os }}-users-dashboard-app-node-modules-${{ hashFiles('users-dashboard-app/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-users-dashboard-app-node-modules-      

    # Install dependencies for registration-app
    - name: Install dependencies for registration-app
      run: |
        cd registration-app
        npm install

    # Install dependencies for users-dashboard-app
    - name: Install dependencies for users-dashboard-app
      run: |
        cd users-dashboard-app
        npm install
          
    # Docker Setup
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

     # Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}  

    - name: Set docker image version variable
      run: echo "VERSION=v$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV
      shell: bash

    # Build and push the registration app image
    - name: Build and push registration app image
      uses: docker/build-push-action@v4
      with:
            context: ./registration-app
            file: ./registration-app/Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/registration-app:${{ env.VERSION }}

    # Build and push the users dashboard app image
    - name: Build and push users deshbiard app image
      uses: docker/build-push-action@v4
      with:
        context: ./users-dashboard-app 
        file: ./users-dashboard-app/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/users-dashboard-app:${{ env.VERSION }}   
    
    # Update image tags in Helm values.yaml
    - name: Install yq
      run: |
        wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
        chmod +x /usr/local/bin/yq
  
    - name: Update image tags using yq
      run: |
          yq -i '.registrationApp.image.tag = strenv(VERSION)' user-registration-chart/values.yaml
          yq -i '.usersDashboard.image.tag = strenv(VERSION)' user-registration-chart/values.yaml
      env:
          VERSION: ${{ env.VERSION }}
  
    # Debug values.yaml changes  
    - name: Debug Values File Changes
      run: cat user-registration-chart/values.yaml

    # Commit the updated values.yaml
    - name: Commit and push updated values.yaml
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add user-registration-chart/values.yaml
        git commit -m "Update Helm values.yaml with new image tag: ${VERSION}"
        git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git develop

    
        
         

        
