apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-dashboard
  namespace: registration-js
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-dashboard
  template:
    metadata:
      labels:
        app: users-dashboard
    spec:
      containers:
      - name: users-dashboard
        image: masum012924/users-dashboard-app:v3
        ports:
        - containerPort: 4000

---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: registration-js
spec:
  selector:
    app: users-dashboard
  ports:
  - port: 80
    targetPort: 4000
  type: NodePort

